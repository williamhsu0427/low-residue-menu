<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>低渣飲食菜單</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2f8f6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="低渣菜單">
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#22231f;--sub:#6d6f68;--line:#e2ded4;--accent:#2f8f6b;--soft:#e7f3ed;--warn:#b5462f;--warnsoft:#fbece8;--chip:#f0ede6}
@media (prefers-color-scheme: dark){:root{--bg:#151714;--card:#1f221e;--ink:#eef0ea;--sub:#a3a79d;--line:#343830;--accent:#5cc49a;--soft:#1d3329;--warn:#f08a72;--warnsoft:#3a2420;--chip:#2a2e28}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 4px;max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:21px;margin:0}
header small{display:block;color:var(--sub);font-size:13px;font-weight:400}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:8px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:12px;font-weight:500;color:var(--accent);background:var(--soft);border-radius:999px;padding:2px 9px}
.dish{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px dashed var(--line)}
.dish:first-of-type{border-top:0}
.dish .nm{flex:1;min-width:0;cursor:pointer}
.dish .nm b{font-weight:600}
.dish .nm span{display:block;font-size:12.5px;color:var(--sub)}
.dish .swapped{color:var(--accent);font-size:12px;margin-left:4px}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.daynav .t{text-align:center;flex:1}
.daynav .t b{font-size:20px;display:block}
.daynav .t span{font-size:13px;color:var(--sub)}
.daynav .btn{font-size:18px;padding:6px 14px}
.notice{background:var(--warnsoft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=search],input[type=date],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:13.5px}
.dcard.today{border:2px solid var(--accent)}
.dcard b{font-size:15px}
.dcard div{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard div em{font-style:normal;color:var(--ink)}
.rlist .dish .nm b{font-size:15.5px}
.shop li{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.shop li:first-child{border-top:0}
.shop ul{padding:0;margin:0}
.shop input{width:22px;height:22px;accent-color:var(--accent)}
.shop li.done span{text-decoration:line-through;color:var(--sub)}
.shop .q{margin-left:auto;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guide h3{font-size:14px;margin:0 0 6px}
.guide ul{margin:0;padding-left:18px;font-size:14px}
.guide li{margin:3px 0}
.ok h3{color:var(--accent)}.no h3{color:var(--warn)}
@media (max-width:520px){.guide{grid-template-columns:1fr}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:150px;border:0;background:none;color:var(--sub);font:inherit;font-size:12.5px;padding:8px 0 9px;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:21px;line-height:1.2}
nav button.on{color:var(--accent);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet .meta{color:var(--sub);font-size:13.5px;margin-bottom:12px}
.sheet h3{font-size:15px;margin:14px 0 6px}
.sheet table{width:100%;border-collapse:collapse;font-size:15px}
.sheet td{padding:6px 0;border-bottom:1px dashed var(--line)}
.sheet td:last-child{text-align:right;color:var(--sub);white-space:nowrap}
.sheet ol{padding-left:22px;margin:0}
.sheet ol li{margin:6px 0}
.tip{background:var(--soft);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:12px}
.close{float:right}
.row{display:flex;gap:10px;align-items:center;margin:10px 0}
.row label{min-width:80px;font-size:14px;color:var(--sub)}
.muted{color:var(--sub);font-size:13.5px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:26px}
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin:10px 0 4px;background:var(--chip)}
.credit{font-size:11.5px;color:var(--sub);margin-bottom:8px;word-break:break-all}
.credit a{color:var(--sub)}
.hide{display:none}
</style>
</head>
<body>
<header>
  <div><h1>低渣飲食菜單</h1><small id="hdrSub"></small></div>
  <button class="iconbtn" id="btnSet">⚙ 設定</button>
</header>
<main>
  <section id="tab-today"></section>
  <section id="tab-menu" class="hide"></section>
  <section id="tab-recipes" class="hide"></section>
  <section id="tab-shop" class="hide"></section>
  <section id="tab-guide" class="hide"></section>
</main>
<nav>
  <button data-t="today" class="on"><i>🍽</i>今天</button>
  <button data-t="menu"><i>📅</i>30天菜單</button>
  <button data-t="recipes"><i>📖</i>食譜</button>
  <button data-t="shop"><i>🛒</i>採買</button>
  <button data-t="guide"><i>✅</i>能不能吃</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const DATA = {"recipes":[{"id":"rice","cat":"R","name":"白飯","ings":[["白米",80,"g"]],"steps":["白米洗淨，加 1.2 倍水浸泡 20 分鐘。","電鍋外鍋 1 杯水蒸熟，跳起再燜 10 分鐘。"],"tip":"恢復期可多加一點水煮得較軟；不要用糙米、五穀米、紫米。","mins":40},{"id":"b_salmon_congee","cat":"B","name":"鮭魚蛋花粥","ings":[["白米",50,"g"],["鮭魚片（去皮去刺）",60,"g"],["雞蛋",1,"顆"],["薑片",1,"片"],["鹽",null,"少許"]],"steps":["白米加 8 倍水煮滾，轉小火煮 25 分鐘成粥。","鮭魚切小丁，和薑片放入粥中煮 5 分鐘。","取出薑片，淋入打散的蛋液，輕輕攪拌成蛋花。","加鹽調味即可。"],"tip":"用刀背壓過魚肉，確認沒有細刺再下鍋。","mins":35},{"id":"b_chicken_congee","cat":"B","name":"雞絲南瓜粥","ings":[["白米",50,"g"],["雞胸肉",50,"g"],["南瓜（去皮去籽）",60,"g"],["鹽",null,"少許"]],"steps":["南瓜切小丁，雞胸肉燙熟後撕成細絲。","白米加 8 倍水與南瓜一起煮滾，小火煮 25 分鐘。","加入雞絲再煮 3 分鐘，加鹽調味。"],"tip":"南瓜一定要去皮去籽並煮到軟爛。","mins":35},{"id":"b_egg_toast","cat":"B","name":"滑蛋白吐司","ings":[["白吐司",2,"片"],["雞蛋",2,"顆"],["鮮奶油或水",15,"ml"],["鹽",null,"少許"],["植物油",null,"少許"]],"steps":["白吐司切去硬邊。","雞蛋加水（或少量鮮奶油）和鹽打散。","平底鍋少油、小火，倒入蛋液慢慢推成滑嫩炒蛋。","炒蛋夾入吐司即可。"],"tip":"吐司請用白吐司，避免全麥、雜糧、葡萄乾吐司。","mins":10},{"id":"b_steamed_egg_bun","cat":"B","name":"蒸蛋＋白饅頭","ings":[["雞蛋",2,"顆"],["白饅頭",1,"個"],["鹽",null,"少許"]],"steps":["雞蛋打散，加 1.5 倍溫水和鹽拌勻，過篩去泡。","蓋上盤子或保鮮膜，電鍋外鍋半杯水蒸到跳起。","白饅頭一起放入電鍋蒸熱。"],"tip":"饅頭選白饅頭，不要雜糧、黑糖桂圓或堅果口味。","mins":20},{"id":"b_pork_congee","cat":"B","name":"瘦肉皮蛋粥","ings":[["白米",50,"g"],["豬絞肉（瘦）",50,"g"],["皮蛋",1,"顆"],["鹽",null,"少許"],["白胡椒",null,"極少"]],"steps":["白米加 8 倍水煮成粥。","絞肉用少許水拌開，倒入粥中攪散煮熟。","皮蛋切小丁加入，煮 2 分鐘後調味。"],"tip":"恢復期胡椒可以省略。","mins":35},{"id":"b_french_toast","cat":"B","name":"法式吐司","ings":[["白吐司",2,"片"],["雞蛋",1,"顆"],["鮮奶油或水",20,"ml"],["砂糖",null,"少許"],["奶油",5,"g"]],"steps":["吐司去邊，每片切成 4 塊。","雞蛋、水（或少量鮮奶油）、糖打勻，吐司兩面沾滿蛋液。","平底鍋放奶油，小火把兩面煎到金黃。"],"tip":"只用少量奶油，不要煎到焦脆。","mins":15},{"id":"b_noodle_soup","cat":"B","name":"蛋花麵線","ings":[["白麵線",50,"g"],["雞蛋",1,"顆"],["雞高湯",300,"ml"],["鹽",null,"少許"]],"steps":["麵線先燙過去除鹹味，撈起備用。","高湯煮滾，淋入蛋液成蛋花。","放入麵線煮 1 分鐘即可。"],"tip":"用白麵線，不要紅麵線（含較多添加物、偏鹹）。","mins":10},{"id":"b_tuna_sandwich","cat":"B","name":"鮪魚蛋沙拉三明治","ings":[["白吐司",2,"片"],["水煮鮪魚罐頭",40,"g"],["雞蛋",1,"顆"],["美乃滋",10,"g"]],"steps":["雞蛋水煮 10 分鐘，剝殼壓碎。","鮪魚瀝乾，和蛋碎、美乃滋拌勻。","吐司去邊，夾入內餡對切。"],"tip":"鮪魚選水煮的，不要油漬或加辣口味；不加生菜、小黃瓜。","mins":15},{"id":"b_potato_soup_toast","cat":"B","name":"馬鈴薯濃湯＋白吐司","ings":[["馬鈴薯（去皮）",120,"g"],["洋蔥",20,"g"],["雞高湯",250,"ml"],["白吐司",1,"片"],["鹽",null,"少許"]],"steps":["馬鈴薯、洋蔥切小塊，加高湯煮 15 分鐘到軟爛。","用果汁機或湯匙壓成細滑的濃湯，加鹽調味。","搭配去邊白吐司。"],"tip":"洋蔥要煮到完全軟化；可以省略。","mins":25},{"id":"b_rice_noodle","cat":"B","name":"雞肉米粉湯","ings":[["細米粉",40,"g"],["雞胸肉",50,"g"],["紅蘿蔔（去皮）",20,"g"],["雞高湯",350,"ml"],["鹽",null,"少許"]],"steps":["米粉泡軟；雞胸切細絲、紅蘿蔔切細絲。","高湯煮滾，放入紅蘿蔔煮 5 分鐘到軟。","放入雞絲、米粉煮 3 分鐘，加鹽。"],"tip":"米粉選純米製品。","mins":20},{"id":"b_pancake","cat":"B","name":"香蕉鬆餅","ings":[["低筋麵粉",50,"g"],["雞蛋",1,"顆"],["香蕉",0.5,"根"],["水",50,"ml"],["泡打粉",null,"少許"],["砂糖",null,"少許"]],"steps":["香蕉壓成泥，和雞蛋、水、糖拌勻。","加入麵粉和泡打粉拌到無粉粒。","平底鍋不放油或極少油，小火煎成小圓餅。"],"tip":"香蕉要選熟透的；不加堅果、巧克力豆。","mins":15},{"id":"b_fish_congee","cat":"B","name":"鯛魚粥","ings":[["白米",50,"g"],["鯛魚片",70,"g"],["薑絲",1,"片"],["鹽",null,"少許"]],"steps":["白米加 8 倍水煮成粥。","鯛魚片切小塊，和薑絲下粥煮 3 分鐘。","加鹽調味。"],"tip":"鯛魚片通常無刺，仍建議切塊時再檢查一次。","mins":35},{"id":"m_steam_bass","cat":"M","name":"清蒸鱸魚片","ings":[["鱸魚片（無刺）",120,"g"],["薑片",2,"片"],["蔥白",1,"段"],["醬油",null,"少許"],["米酒",null,"少許"]],"steps":["魚片洗淨擦乾，放盤上鋪薑片、蔥白。","電鍋外鍋半杯水蒸 10 分鐘。","取出薑蔥，淋少許醬油即可。"],"tip":"買市售「無刺鱸魚片」最安全；蔥只用蔥白、不吃蔥綠。","mins":15},{"id":"m_minced_pork_tofu","cat":"M","name":"肉末燴嫩豆腐","ings":[["嫩豆腐",150,"g"],["豬絞肉（瘦）",60,"g"],["醬油",null,"少許"],["太白粉水",null,"少許"],["植物油",null,"少許"]],"steps":["嫩豆腐切小塊，熱水燙 1 分鐘撈起。","少油炒散絞肉到變色，加 100ml 水和醬油煮滾。","放入豆腐燜煮 3 分鐘，用太白粉水勾薄芡。"],"tip":"不加辣豆瓣、蒜末；這道是麻婆豆腐的低渣版本。","mins":15},{"id":"m_chicken_potato","cat":"M","name":"日式馬鈴薯燉雞","ings":[["去皮雞腿肉",120,"g"],["馬鈴薯（去皮）",100,"g"],["紅蘿蔔（去皮）",40,"g"],["醬油",null,"少許"],["味醂",null,"少許"]],"steps":["雞腿去皮切塊，馬鈴薯、紅蘿蔔切滾刀塊。","鍋中放雞肉、蔬菜，加水蓋過食材。","加醬油、味醂，小火燉 25 分鐘到馬鈴薯軟爛。"],"tip":"紅蘿蔔要燉到筷子一壓就碎。","mins":35},{"id":"m_steamed_patty","cat":"M","name":"冬瓜蒸肉餅","ings":[["豬絞肉（瘦）",100,"g"],["冬瓜（去皮去籽）",50,"g"],["雞蛋白",1,"份"],["醬油",null,"少許"],["太白粉",null,"少許"]],"steps":["冬瓜磨成泥並擠掉部分水分。","絞肉加冬瓜泥、 om/photos/44124364575@N01/15288615"}, "n_apple_puree": {"t": "Apples and Applesauce", "by": "Linda, Fortuna future", "lic": "CC BY-NC 2.0", "url": "https://www.flickr.com/photos/53470892@N08/40233729691"}, "n_pudding": {"t": "Custard pudding", "by": "yoshimov", "lic": "CC BY-ND 2.0", "url": "https://www.flickr.com/photos/69203469@N00/42270525"}, "n_toast_jam": {"t": "Toast with Jam", "by": "moriza", "lic": "CC BY 2.0", "url": "https://www.flickr.com/photos/44373968@N00/2390513602"}, "n_papaya": {"t": "papaya slices", "by": "preetamrai", "lic": "CC BY 2.0", "url": "https://www.flickr.com/photos/51035566865@N01/1317780"}, "n_douhua": {"t": "Flushing - Jade Asian Restaurant: Douhua", "by": "wallyg", "lic": "CC BY-NC-ND 2.0", "url": "https://www.flickr.com/photos/70323761@N00/6763974977"}, "n_rice_pudding": {"t": "Rice pudding: the finished product", "by": "randomduck", "lic": "CC BY-SA 2.0", "url": "https://www.flickr.com/photos/96463101@N00/428297650"}, "n_peach": {"t": "Peach Slices", "by": "neil conway", "lic": "CC BY 2.0", "url": "https://www.flickr.com/photos/30934989@N06/3824702094"}};
const EMO = {B:'🥣',M:'🍲',O:'🍜',V:'🥕',S:'🥘',N:'🍮',R:'🍚'};
const thumb = r => CREDITS[r.id] ? `<img class="thumb" loading="lazy" src="images/${r.id}.webp" alt="">` : `<div class="thumb">${EMO[r.cat]}</div>`;
const RC = {}; DATA.recipes.forEach(r => RC[r.id] = r);
const CATN = {B:'早餐',M:'主菜',O:'一碗料理',V:'蔬菜',S:'湯品',N:'點心',R:'主食'};
const MEALS = [['b','早餐','☀️'],['l','午餐','🍱'],['d','晚餐','🌙'],['n','點心','🍌']];
const DISC = '⚠️ 本菜單僅供參考，實際飲食內容、份量與期間請依醫師／營養師指示。若出現腹痛、黑便、血便、頭暈等情形，請立即就醫。';

// ---- 儲存（失敗也不影響使用）----
const store = {
  get(k, d){ try{ const v = localStorage.getItem('lrm-'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('lrm-'+k, JSON.stringify(v)); }catch(e){} }
};
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let S = {
  start: store.get('start', ymd(new Date())),
  serv: store.get('serv', 1),
  swaps: store.get('swaps', {}),
  shop: store.get('shop', {}),
};
function save(){ store.set('start',S.start); store.set('serv',S.serv); store.set('swaps',S.swaps); store.set('shop',S.shop); }

function dayInfo(){
  const s = new Date(S.start+'T00:00:00'), t = new Date(ymd(new Date())+'T00:00:00');
  const diff = Math.round((t - s)/86400000);
  if (diff < 0) return {idx:0, round:1, before:-diff, total:diff};
  return {idx: diff % 30, round: Math.floor(diff/30)+1, before:0, total:diff};
}
let viewDay = dayInfo().idx;

function dishesOf(day, meal){
  return DATA.plan[day][meal].map((id,i) => {
    const k = day+'|'+meal+'|'+i;
    return {id: S.swaps[k] || id, orig:id, key:k, swapped: !!S.swaps[k]};
  });
}
function swap(key, cur){
  const [day, meal, i] = key.split('|');
  const orig = DATA.plan[day][meal][i];
  const cat = RC[orig].cat;
  const pool = DATA.recipes.filter(r => r.cat === cat).map(r => r.id);
  // 一碗料理和早餐可互換到同類；主菜可在主菜池中輪換
  let j = (pool.indexOf(cur)+1) % pool.length;
  let nx = pool[j];
  if (nx === orig) delete S.swaps[key]; else S.swaps[key] = nx;
  save(); render();
}

// ---- 份量顯示 ----
function fmtQ(q, u){
  if (q == null) return u;
  let v = q * S.serv;
  if (u === 'g' || u === 'ml') { v = v >= 30 ? Math.round(v/5)*5 : Math.round(v); return v + ' ' + u; }
  const whole = Math.floor(v), frac = v - whole;
  let s = whole ? String(whole) : '';
  if (Math.abs(frac-0.5) < 0.01) s += (s?' ':'') + '½';
  else if (frac > 0.01) s = (Math.round(v*10)/10).toString();
  return s + ' ' + u;
}

// ---- 今天 ----
function renderToday(){
  const info = dayInfo();
  const el = document.getElementById('tab-today');
  const isToday = viewDay === info.idx && !info.before;
  let h = '';
  if (info.before) h += `<div class="notice" style="background:var(--soft);color:var(--accent)">還有 ${info.before} 天才開始（開始日 ${S.start}），先看第 1 天的菜單。</div>`;
  h += `<div class="daynav"><button class="btn" onclick="go(-1)">◀</button>
    <div class="t"><b>第 ${viewDay+1} 天</b><span>${isToday ? '今天 · 第 '+info.round+' 輪' : '<a href="#" onclick="viewDay=dayInfo().idx;render();return false">回到今天</a>'}</span></div>
    <button class="btn" onclick="go(1)">▶</button></div>`;
  MEALS.forEach(([m, nm, ic]) => {
    h += `<div class="card"><h2>${ic} ${nm}</h2>`;
    dishesOf(viewDay, m).forEach(d => {
      const r = RC[d.id];
      h += `<div class="dish">${thumb(r)}<div class="nm" onclick="openR('${d.id}')"><b>${r.name}</b>${d.swapped?'<em class="swapped">已換</em>':''}<span>${CATN[r.cat]} · 約 ${r.mins} 分鐘 · 點我看食譜</span></div>`;
      if (r.cat !== 'R') h += `<button class="btn" onclick="swap('${d.key}','${d.id}')">🔄 換</button>`;
      h += `</div>`;
    });
    h += `</div>`;
  });
  h += `<div class="notice">${DISC}</div>`;
  el.innerHTML = h;
}
function go(n){ viewDay = (viewDay + n + 30) % 30; render(); }

// ---- 30 天菜單 ----
function renderMenu(){
  const info = dayInfo();
  let h = `<p class="muted">點任一天看詳細內容。第 31 天起會自動從第 1 天重新輪。</p><div class="daygrid">`;
  for (let d=0; d<30; d++){
    const name = m => dishesOf(d, m).filter(x=>x.id!=='rice').map(x=>RC[x.id].name).join('、');
    h += `<div class="dcard ${d===info.idx && !info.before?'today':''}" onclick="viewDay=${d};tab('today')"><b>第 ${d+1} 天</b>${d===info.idx && !info.before?' <span class="muted">（今天）</span>':''}
      <div>☀️ <em>${name('b')}</em></div><div>🍱 <em>${name('l')}</em></div><div>🌙 <em>${name('d')}</em></div><div>🍌 <em>${name('n')}</em></div></div>`;
  }
  document.getElementById('tab-menu').innerHTML = h + '</div>';
}

// ---- 食譜 ----
let rq = '', rc = '';
function renderRecipes(){
  const el = document.getElementById('tab-recipes');
  if (!el.dataset.init){
    el.innerHTML = `<input type="search" id="rq" placeholder="搜尋菜名或食材，例如：鮭魚、南瓜"><div class="chips" id="rcats" style="margin-top:10px"></div><div class="card rlist" id="rlist"></div>`;
    el.dataset.init = 1;
    document.getElementById('rq').addEventListener('input', e => { rq = e.target.value.trim(); renderRecipes(); });
  }
  document.getElementById('rcats').innerHTML = [['','全部'],...Object.entries(CATN)].map(([k,v]) => `<button class="chip ${rc===k?'on':''}" onclick="rc='${k}';renderRecipes()">${v}</button>`).join('');
  const list = DATA.recipes.filter(r => (!rc || r.cat===rc) && (!rq || r.name.includes(rq) || r.ings.some(i => i[0].includes(rq))));
  document.getElementById('rlist').innerHTML = list.length ? list.map(r => `<div class="dish">${thumb(r)}<div class="nm" onclick="openR('${r.id}')"><b>${r.name}</b><span>${CATN[r.cat]} · 約 ${r.mins} 分鐘 · ${r.ings.filter(i=>i[1]!=null).map(i=>i[0].replace(/（.*?）/,'')).slice(0,4).join('、')}</span></div></div>`).join('') : '<p class="muted">找不到符合的食譜</p>';
}
function openR(id){
  const r = RC[id];
  const main = r.ings.filter(i => i[1] != null), sea = r.ings.filter(i => i[1] == null);
  let h = `<button class="btn close" onclick="closeM()">✕ 關閉</button><h2>${r.name}</h2>${CREDITS[id] ? `<img class="hero" src="images/${id}.webp" alt="${r.name}"><div class="credit">示意照片（實際做法以食譜為準）· 「${CREDITS[id].t}」by ${CREDITS[id].by} · ${CREDITS[id].lic} · <a href="${CREDITS[id].url}" target="_blank" rel="noopener">來源</a></div>` : ''}
    <div class="meta">${CATN[r.cat]} · 約 ${r.mins} 分鐘 · ${S.serv} 人份</div>
    <h3>食材</h3><table>${main.map(i => `<tr><td>${i[0]}</td><td>${fmtQ(i[1], i[2])}</td></tr>`).join('')}</table>`;
  if (sea.length) h += `<h3>調味</h3><table>${sea.map(i => `<tr><td>${i[0]}</td><td>${i[2]}</td></tr>`).join('')}</table>`;
  h += `<h3>做法</h3><ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
  if (r.tip) h += `<div class="tip">💡 ${r.tip}</div>`;
  h += `<p class="muted" style="margin-top:14px">所有食材都要煮到軟爛；少油、不辣、不油炸。份量請依醫師／營養師建議調整。</p>`;
  document.getElementById('sheet').innerHTML = h;
  document.getElementById('modal').classList.add('show');
}
function closeM(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeM(); });

// ---- 採買清單 ----
let shopWeek = null;
function weeks(){ return [[0,6],[7,13],[14,20],[21,27],[28,29]]; }
function renderShop(){
  const W = weeks();
  if (shopWeek == null){ const i = dayInfo().idx; shopWeek = W.findIndex(([a,b]) => i>=a && i<=b); }
  const [a,b] = W[shopWeek];
  const sum = {}, sea = new Set();
  for (let d=a; d<=b; d++) MEALS.forEach(([m]) => dishesOf(d,m).forEach(x => RC[x.id].ings.forEach(([n,q,u]) => {
    if (q == null){ sea.add(n); return; }
    if (n === '白飯' && u === '碗'){ n = '白米'; q = q*80; u = 'g'; }
    if (n === '水') return;
    const k = n+'|'+u; sum[k] = (sum[k]||0) + q;
  })));
  const items = Object.entries(sum).sort((x,y) => x[0].localeCompare(y[0], 'zh-Hant'));
  const wk = 'w'+shopWeek; const done = S.shop[wk] || {};
  let h = `<div class="chips">${W.map(([x,y],i) => `<button class="chip ${i===shopWeek?'on':''}" onclick="shopWeek=${i};renderShop()">第 ${x+1}–${y+1} 天</button>`).join('')}</div>
    <div class="card shop"><h2>🛒 採買清單 <span class="tag">${S.serv} 人份 · ${b-a+1} 天</span></h2><ul>`;
  items.forEach(([k,q]) => { const [n,u] = k.split('|'); h += `<li class="${done[k]?'done':''}"><input type="checkbox" ${done[k]?'checked':''} onchange="tick('${wk}','${k}',this.checked)"><span>${n}</span><span class="q">${fmtQ(q,u)}</span></li>`; });
  h += `</ul><p class="muted" style="margin:10px 0 0">數量是整週加總，已包含你換過的菜。肉魚可分裝冷凍，用前一晚移到冷藏退冰。</p>
    <p style="margin:10px 0 0"><button class="btn" onclick="S.shop['${wk}']={};save();renderShop()">清除勾選</button></p></div>
    <div class="card"><h2>🧂 常備調味料</h2><p style="margin:0">${[...sea].join('、')}</p></div>`;
  document.getElementById('tab-shop').innerHTML = h;
}
function tick(wk, k, v){ S.shop[wk] = S.shop[wk] || {}; S.shop[wk][k] = v; save(); renderShop(); }

// ---- 能不能吃 ----
let gq = '';
function renderGuide(){
  const el = document.getElementById('tab-guide');
  if (!el.dataset.init){
    el.innerHTML = `<input type="search" id="gq" placeholder="查食材，例如：地瓜、芭樂、虱目魚"><div id="glist" style="margin-top:12px"></div>`;
    el.dataset.init = 1;
    document.getElementById('gq').addEventListener('input', e => { gq = e.target.value.trim(); renderGuide(); });
  }
  const f = arr => gq ? arr.filter(s => s.includes(gq)) : arr;
  let h = '', hit = 0;
  DATA.guide.forEach(g => {
    const ok = f(g.ok), no = f(g.no); hit += ok.length + no.length;
    if (gq && !ok.length && !no.length) return;
    h += `<div class="card"><h2>${g.g}</h2><div class="guide"><div class="ok"><h3>✅ 可以吃</h3><ul>${ok.map(s=>`<li>${s}</li>`).join('') || '<li class="muted">—</li>'}</ul></div><div class="no"><h3>⛔ 避免</h3><ul>${no.map(s=>`<li>${s}</li>`).join('') || '<li class="muted">—</li>'}</ul></div></div></div>`;
  });
  if (gq && !hit) h = `<div class="card"><p style="margin:0">清單裡沒有「${gq}」。不確定的食材，原則是：<b>去皮、去籽、煮軟、不辣、不油炸</b>，有疑問請問醫師或營養師。</p></div>`;
  h += `<div class="card"><h2>📌 低渣飲食原則</h2><ul style="margin:0;padding-left:20px"><li>選精緻白米、白麵，避免全穀類</li><li>蔬菜去皮去籽、煮到軟爛，避免粗纖維</li><li>選無刺魚片與嫩肉，去皮去筋</li><li>少油、不辣、不油炸，避免酒和咖啡</li><li>少量多餐、細嚼慢嚥、多喝水</li></ul></div><div class="notice">${DISC}</div>`;
  document.getElementById('glist').innerHTML = h;
}

// ---- 設定 ----
function openSet(){
  document.getElementById('sheet').innerHTML = `<button class="btn close" onclick="closeM()">✕ 關閉</button><h2>設定</h2>
    <div class="row"><label>開始日</label><input type="date" id="sStart" value="${S.start}"></div>
    <div class="row"><label>份量</label><select id="sServ">${[1,2,3,4].map(n=>`<option value="${n}" ${n==S.serv?'selected':''}>${n} 人份</option>`).join('')}</select></div>
    <p class="muted">開始日設好後，「今天」會自動顯示第幾天；30 天吃完自動重新輪。</p>
    <div class="row"><button class="btn" onclick="if(confirm('把所有換過的菜恢復原本的菜單？')){S.swaps={};save();render();closeM()}">恢復原本菜單</button></div>
    <div class="notice" style="margin-top:12px">${DISC}</div>
    <p style="text-align:right"><button class="btn pri" onclick="saveSet()">儲存</button></p>`;
  document.getElementById('modal').classList.add('show');
}
function saveSet(){
  const v = document.getElementById('sStart').value; if (v) S.start = v;
  S.serv = +document.getElementById('sServ').value || 1;
  save(); viewDay = dayInfo().idx; shopWeek = null; closeM(); render();
}
document.getElementById('btnSet').onclick = openSet;

// ---- 分頁 ----
let cur = 'today';
function tab(t){
  cur = t;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('hide', s.id !== 'tab-'+t));
  render(); window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.t));
function render(){
  const info = dayInfo();
  document.getElementById('hdrSub').textContent = info.before ? `${S.start} 開始` : `今天第 ${info.idx+1} 天 · ${S.serv} 人份`;
  ({today:renderToday, menu:renderMenu, recipes:renderRecipes, shop:renderShop, guide:renderGuide})[cur]();
}
render();
if (!store.get('seen', false)){ store.set('seen', true); openSet(); }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
